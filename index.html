<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巨人の世界</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; }
    #app { position: fixed; inset: 0; user-select: none; }
    #app canvas { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; inset: 0; pointer-events: none; text-shadow: 0 1px 3px #000; }
    .hud-tl { position: absolute; left: 16px; top: 16px; width: 240px; }
    .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
    .bar span { width: 36px; }
    .bar i { flex: 1; height: 12px; background: rgba(0,0,0,.5); border-radius: 6px; overflow: hidden; display: block; }
    .bar b { display: block; height: 100%; background: #e05050; }
    .bar b.gas { background: #4fc3f7; }
    .bar b.sup { background: #f0c040; }
    .bar b.sup.full { background: #fff070; animation: blink .5s infinite alternate; }
    @keyframes blink { to { opacity: .5; } }
    .blade { font-size: 13px; }
    .hud-tr { position: absolute; right: 16px; top: 16px; text-align: right; font-size: 15px; line-height: 1.6; }
    .hud-bl { position: absolute; left: 16px; bottom: 12px; font-size: 12px; opacity: .8; }
    .hint { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 20px; color: #ffe066; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; }
    .overlay button { margin-top: 16px; padding: 10px 28px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
