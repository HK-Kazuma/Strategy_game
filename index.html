<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巨人の世界</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; }
    #app { position: fixed; inset: 0; user-select: none; }
    #app canvas { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; inset: 0; pointer-events: none; text-shadow: 0 1px 3px #000; }
    .hud-tl { position: absolute; left: 16px; top: 16px; width: 240px; }
    .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
    .bar span { width: 36px; }
    .bar i { flex: 1; height: 12px; background: rgba(0,0,0,.5); border-radius: 6px; overflow: hidden; display: block; }
    .bar b { display: block; height: 100%; background: #e05050; }
    .bar b.gas { background: #4fc3f7; }
    .bar b.sup { background: #f0c040; }
    .bar b.sup.full { background: #fff070; animation: blink .5s infinite alternate; }
    @keyframes blink { to { opacity: .5; } }
    .blade { font-size: 13px; }
    .hud-tr { position: absolute; right: 16px; top: 16px; text-align: right; font-size: 15px; line-height: 1.6; }
    .hud-bl { position: absolute; left: 16px; bottom: 12px; font-size: 12px; opacity: .8; }
    .hint { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 20px; color: #ffe066; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; }
    .overlay button { margin-top: 16px; padding: 10px 28px; font-size: 16px; cursor: pointer; }
    .base-ui { position: absolute; inset: 0; pointer-events: none; font-size: 13px; }
    .base-ui > div, .b-modal { pointer-events: auto; }
    .b-top { position: absolute; left: 0; right: 0; top: 0; background: rgba(20,24,32,.85); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .b-top .day { font-weight: bold; color: #ffe066; }
    .b-left { position: absolute; left: 8px; top: 64px; width: 170px; background: rgba(20,24,32,.85); padding: 8px; border-radius: 6px; max-height: calc(100% - 140px); overflow-y: auto; }
    .b-right { position: absolute; right: 8px; top: 64px; width: 210px; background: rgba(20,24,32,.85); border-radius: 6px; padding: 0 8px; }
    .b-right:empty { display: none; }
    .b-left h4, .b-right h4 { margin: 8px 0 4px; font-size: 13px; }
    .base-ui button { display: block; width: 100%; margin: 3px 0; padding: 5px 8px; background: #3a4660; color: #fff; border: 1px solid #5a6a90; border-radius: 4px; cursor: pointer; text-align: left; }
    .base-ui button small { display: block; opacity: .7; font-size: 11px; }
    .base-ui button.on { background: #4a7a50; }
    .base-ui button:disabled { opacity: .4; cursor: default; }
    .base-ui .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .base-ui .row button { width: 28px; text-align: center; margin: 0; }
    .b-bottom { position: absolute; right: 12px; bottom: 12px; }
    .b-bottom .next { font-size: 18px; padding: 10px 22px; background: #c07a28; text-align: center; }
    .b-toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(0,0,0,.75); padding: 8px 16px; border-radius: 6px; transition: opacity .3s; opacity: 0; pointer-events: none !important; }
    .b-modal { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
    .b-modal .card { background: #1c2230; padding: 20px 28px; border-radius: 8px; min-width: 320px; font-size: 14px; }
    .b-modal .warn { color: #ffb060; }
    .b-modal button { margin-top: 12px; padding: 8px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
